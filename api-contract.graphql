# Tomoga Admin GraphQL API Contract
# Source: admin UI screenshots + erd.dbml (same scope as api-contract.openapi.yaml)
# Not reverse-engineered from the live backend schema under src/api/
# Endpoint: POST /graphql
# Localization uses LocalizedString { en, ar } ⇔ ERD *_en / *_ar

# ============================================================
# Scalars & shared
# ============================================================

scalar Date
scalar DateTime
scalar Upload

type LocalizedString {
  en: String
  ar: String
}

input LocalizedStringInput {
  en: String
  ar: String
}

type PaginationMeta {
  page: Int!
  perPage: Int!
  total: Int!
  totalPages: Int!
}

input PaginationInput {
  page: Int = 1
  perPage: Int = 10
}

enum PeriodFilter {
  daily
  weekly
  monthly
  yearly
}

type ExportFile {
  url: String
  contentBase64: String
  mimeType: String
  fileName: String
}

# ============================================================
# Auth / Admin
# ============================================================

enum AdminStatus {
  active
  inactive
}

enum Language {
  ar
  en
}

type Admin {
  id: ID!
  firstName: String
  lastName: String
  email: String!
  phone: String
  phoneCountryCode: String
  avatarUrl: String
  role: String
  preferredLanguage: Language
  darkMode: Boolean
  status: AdminStatus
  joinDate: DateTime
}

input AdminWriteInput {
  firstName: String
  lastName: String
  email: String!
  phone: String
  phoneCountryCode: String
  avatarUrl: String
  role: String
}

type AdminPage {
  data: [Admin!]!
  meta: PaginationMeta!
}

input SignInInput {
  email: String!
  password: String!
}

type SignInPayload {
  requires2fa: Boolean!
  challengeId: ID
  phoneHint: String
  session: AuthSession
}

input Verify2faInput {
  challengeId: ID!
  code: String!
}

type AuthSession {
  accessToken: String!
  refreshToken: String
  admin: Admin!
}

