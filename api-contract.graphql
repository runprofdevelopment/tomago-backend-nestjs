# ============================================================
# Query
# ============================================================

type Query {
  # Auth
  authMe: Admin!

  # Dashboard
  dashboardKpis(period: PeriodFilter = monthly): DashboardKpis!

  # Orders
  orders(filter: OrderFilterInput, pagination: PaginationInput): OrderPage!
  order(id: ID!): OrderDetail!
  exportOrders(filter: OrderFilterInput): ExportFile!

  # Customer requests
  customerRequests(status: CustomerRequestStatus, q: String, pagination: PaginationInput): CustomerRequestPage!
  customerRequest(id: ID!): CustomerRequestDetail!

  # Returns
  returnRequests(status: ReturnRequestStatus, q: String, pagination: PaginationInput): ReturnRequestPage!
  returnRequest(id: ID!): ReturnRequest!

  # Customers
  customers(q: String, period: PeriodFilter, pagination: PaginationInput): CustomerPage!
  customer(id: ID!): CustomerDetail!
  customerAddresses(customerId: ID!): [CustomerAddress!]!
  customerOrders(customerId: ID!, pagination: PaginationInput): OrderPage!
  customerReviews(customerId: ID!): [Review!]!
  exportCustomers(q: String, period: PeriodFilter): ExportFile!

  # Finance
  platformWallet: PlatformWallet!
  platformWalletTransactions(pagination: PaginationInput): PlatformWalletTransactionPage!
  wallets(q: String, pagination: PaginationInput): WalletPage!
  transactions(orderId: ID, type: TransactionType, q: String, pagination: PaginationInput): TransactionPage!
  refunds(status: RefundStatus, pagination: PaginationInput): RefundPage!
  withdrawals(status: WithdrawalStatus, pagination: PaginationInput): WithdrawalPage!

  # Products
  products(type: ProductType, status: String, q: String, pagination: PaginationInput): ProductPage!
  product(id: ID!): Product!
  exportProducts(q: String): ExportFile!

  # Catalog
  brands: [Brand!]!
  collections(q: String, pagination: PaginationInput): CollectionPage!
  categories(q: String, pagination: PaginationInput): CategoryPage!
  productOptions(q: String, pagination: PaginationInput): ProductOptionPage!

  # Reviews
  reviews(orderId: ID, productId: ID, q: String, pagination: PaginationInput): ReviewPage!
  exportReviews(q: String): ExportFile!

  # Projects
  projects(status: ProjectStatus, q: String, pagination: PaginationInput): ProjectPage!
  project(id: ID!): Project!
  showRooms: [ShowRoom!]!

  # Marketing
  vouchers(q: String, pagination: PaginationInput): VoucherPage!
  deals(q: String, pagination: PaginationInput): DealPage!
  deal(id: ID!): DealDetail!
  sliders(pagination: PaginationInput): SliderPage!
  topBanner: TopBanner
  ads(q: String, pagination: PaginationInput): AdPage!
  videoAds: [VideoAd!]!

  # Settings
  platformSettings: PlatformSettings!
  admins(q: String, pagination: PaginationInput): AdminPage!
  staticPage(type: StaticPageType!, language: Language!): StaticPage!

  # Contact
  contactMessages(q: String, period: PeriodFilter, pagination: PaginationInput): ContactMessagePage!
  exportContactMessages(q: String, period: PeriodFilter): ExportFile!
}

# ============================================================
# Mutation
# ============================================================

type Mutation {
  # Auth
  authSignIn(input: SignInInput!): SignInPayload!
  authVerify2fa(input: Verify2faInput!): AuthSession!
  authResend2fa(challengeId: ID!): Boolean!
  authForgotPassword(email: String!): Boolean!

  # Orders
  acceptOrder(id: ID!): Order!
  rejectOrder(id: ID!, rejectionReason: String!): Order!
  cancelOrder(id: ID!, cancelReason: String): Order!
  updateOrderShipping(id: ID!, input: OrderShippingUpdateInput!): Order!

  # Customer requests
  replyCustomerRequest(id: ID!, input: CustomerRequestReplyInput!): CustomerRequestDetail!
  acceptCustomerRequest(id: ID!): CustomerRequest!
  cancelCustomerRequest(id: ID!): CustomerRequest!
  closeCustomerRequest(id: ID!): CustomerRequest!

  # Returns
  acceptReturnRequest(id: ID!): ReturnRequest!
  rejectReturnRequest(id: ID!, rejectionReason: String): ReturnRequest!

  # Customers
  createCustomer(input: CustomerWriteInput!): Customer!
  updateCustomer(id: ID!, input: CustomerWriteInput!): Customer!
  addCustomerWalletFund(customerId: ID!, input: WalletAmountNoteInput!): Wallet!
  withdrawCustomerWallet(customerId: ID!, input: WalletAmountNoteInput!): Wallet!
  sendCustomerNotification(customerId: ID!, input: CustomerNotificationInput!): CustomerNotification!

  # Finance
  rechargePlatformWallet(amount: Float!): PlatformWallet!
  deductPlatformWallet(input: WalletAmountNoteInput!): PlatformWallet!
  approveWithdrawal(id: ID!): Withdrawal!
  rejectWithdrawal(id: ID!, rejectionReason: String!): Withdrawal!

  # Products
  createProduct(input: ProductWriteInput!): Product!
  updateProduct(id: ID!, input: ProductWriteInput!): Product!
  deleteProduct(id: ID!): Boolean!

  # Catalog
  createBrand(input: BrandWriteInput!): Brand!
  createCollection(input: CollectionWriteInput!): Collection!
  updateCollection(id: ID!, input: CollectionWriteInput!): Collection!
  setCollectionStatus(id: ID!, status: ActiveStatus!): Collection!
  createCategory(input: CategoryWriteInput!): Category!
  updateCategory(id: ID!, input: CategoryWriteInput!): Category!
  setCategoryStatus(id: ID!, status: ActiveStatus!): Category!
  createProductOption(input: ProductOptionWriteInput!): ProductOption!
  updateProductOption(id: ID!, input: ProductOptionWriteInput!): ProductOption!

