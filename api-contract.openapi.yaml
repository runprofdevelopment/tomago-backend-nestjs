openapi: 3.0.3
info:
  title: Tomoga Admin API Contract
  description: |
    API contract inferred from admin dashboard UI screenshots + `erd.dbml`.
    Not reverse-engineered from the live GraphQL backend.
    Localization uses `{ en, ar }` objects (Firestore shape) equivalent to ERD `*_en` / `*_ar`.
  version: 1.0.0

servers:
  - url: /api/v1
    description: Admin API base (path placeholder)

tags:
  - name: Auth
  - name: Dashboard
  - name: Orders
  - name: CustomerRequests
  - name: Returns
  - name: Customers
  - name: Finance
  - name: Products
  - name: Catalog
  - name: Reviews
  - name: Projects
  - name: Marketing
  - name: Settings
  - name: ContactUs

paths:
  # ========================= Auth =========================
  /auth/sign-in:
    post:
      tags: [Auth]
      summary: Admin sign in (email + password)
      operationId: authSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Credentials accepted; may require 2FA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-2fa:
    post:
      tags: [Auth]
      summary: Verify 6-digit TOTP / OTP
      operationId: authVerify2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verify2faRequest'
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'

  /auth/resend-2fa:
    post:
      tags: [Auth]
      summary: Resend OTP
      operationId: authResend2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id]
              properties:
                challenge_id: { type: string }
      responses:
        '204':
          description: Resent

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: authForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204':
          description: Reset email sent if account exists

  /auth/me:
    get:
      tags: [Auth]
      summary: Current admin profile
      operationId: authMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'

  # ========================= Dashboard =========================
  /dashboard/kpis:
    get:
      tags: [Dashboard]
      summary: Dashboard KPI cards
      operationId: dashboardKpis
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PeriodFilter'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardKpis'

  # ========================= Orders =========================
  /orders:
    get:
      tags: [Orders]
      summary: List catalog orders
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/PeriodFilter'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: payment_method
          in: query
          schema:
            $ref: '#/components/schemas/PaymentMethod'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Order details (items, shipping, totals)
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'

  /orders/{orderId}/accept:
    post:
      tags: [Orders]
      summary: Accept pending order
      operationId: acceptOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/reject:
    post:
      tags: [Orders]
      summary: Reject order with reason
      operationId: rejectOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejection_reason]
              properties:
                rejection_reason: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order (confirm)
      operationId: cancelOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancel_reason: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/shipping:
    patch:
      tags: [Orders]
      summary: Update shipping company / tracking
      operationId: updateOrderShipping
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderShippingUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/export:
    get:
      tags: [Orders]
      summary: Export orders
      operationId: exportOrders
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ========================= Customer Requests =========================
  /customer-requests:
    get:
      tags: [CustomerRequests]
      summary: List custom quote / customer requests
      operationId: listCustomerRequests
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CustomerRequestStatus'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerRequests'

  /customer-requests/{requestId}:
    get:
      tags: [CustomerRequests]
      summary: Request detail + messages
      operationId: getCustomerRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestDetail'

  /customer-requests/{requestId}/reply:
    post:
      tags: [CustomerRequests]
      summary: Reply with estimated price and delivery time
      operationId: replyCustomerRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequestReply'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestDetail'

  /customer-requests/{requestId}/accept:
    post:
      tags: [CustomerRequests]
      operationId: acceptCustomerRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequest'

  /customer-requests/{requestId}/cancel:
    post:
      tags: [CustomerRequests]
      operationId: cancelCustomerRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequest'

  /customer-requests/{requestId}/close:
    post:
      tags: [CustomerRequests]
      operationId: closeCustomerRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequest'

  # ========================= Returns =========================
  /return-requests:
    get:
      tags: [Returns]
      summary: List return requests
      operationId: listReturnRequests
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReturnRequestStatus'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReturnRequests'

  /return-requests/{returnId}:
    get:
      tags: [Returns]
      operationId: getReturnRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: returnId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequest'

  /return-requests/{returnId}/accept:
    post:
      tags: [Returns]
      operationId: acceptReturnRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: returnId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequest'

  /return-requests/{returnId}/reject:
    post:
      tags: [Returns]
      operationId: rejectReturnRequest
      security: [{ bearerAuth: [] }]
      parameters:
        - name: returnId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rejection_reason: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequest'

  # ========================= Customers =========================
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      operationId: listCustomers
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/PeriodFilter'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomers'
    post:
      tags: [Customers]
      summary: Create customer (if UI supports)
      operationId: createCustomer
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/export:
    get:
      tags: [Customers]
      operationId: exportCustomers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /customers/{customerId}:
    get:
      tags: [Customers]
      summary: Customer profile
      operationId: getCustomer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
    patch:
      tags: [Customers]
      operationId: updateCustomer
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{customerId}/addresses:
    get:
      tags: [Customers]
      operationId: listCustomerAddresses
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerAddress'

  /customers/{customerId}/orders:
    get:
      tags: [Customers]
      operationId: listCustomerOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'

  /customers/{customerId}/reviews:
    get:
      tags: [Customers]
      operationId: listCustomerReviews
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'

  /customers/{customerId}/wallet/add-fund:
    post:
      tags: [Customers]
      summary: Add funds to customer wallet
      operationId: addCustomerWalletFund
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAmountNote'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'

  /customers/{customerId}/wallet/withdraw:
    post:
      tags: [Customers]
      summary: Deduct / withdraw from customer wallet
      operationId: withdrawCustomerWallet
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAmountNote'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'

  /customers/{customerId}/notifications:
    post:
      tags: [Customers]
      summary: Send notification (EN + AR)
      operationId: sendCustomerNotification
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerNotificationWrite'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotification'

  # ========================= Finance =========================
  /finance/platform-wallet:
    get:
      tags: [Finance]
      summary: Tomoga / platform wallet balance
      operationId: getPlatformWallet
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformWallet'

  /finance/platform-wallet/transactions:
    get:
      tags: [Finance]
      operationId: listPlatformWalletTransactions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlatformWalletTransactions'

  /finance/platform-wallet/recharge:
    post:
      tags: [Finance]
      operationId: rechargePlatformWallet
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformWallet'

  /finance/platform-wallet/deduct:
    post:
      tags: [Finance]
      operationId: deductPlatformWallet
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAmountNote'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformWallet'

  /finance/wallets:
    get:
      tags: [Finance]
      summary: List customer wallets
      operationId: listWallets
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWallets'

  /finance/transactions:
    get:
      tags: [Finance]
      operationId: listTransactions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: order_id
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactions'

  /finance/refunds:
    get:
      tags: [Finance]
      operationId: listRefunds
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RefundStatus'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRefunds'

  /finance/withdrawals:
    get:
      tags: [Finance]
      operationId: listWithdrawals
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/WithdrawalStatus'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWithdrawals'

  /finance/withdrawals/{withdrawalId}/approve:
    post:
      tags: [Finance]
      operationId: approveWithdrawal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'

  /finance/withdrawals/{withdrawalId}/reject:
    post:
      tags: [Finance]
      operationId: rejectWithdrawal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejection_reason]
              properties:
                rejection_reason: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'

  # ========================= Products / Inventory =========================
  /products:
    get:
      tags: [Products]
      summary: Inventory / product list
      operationId: listProducts
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ProductType'
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'
    post:
      tags: [Products]
      summary: Add new product (single or variant)
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{productId}:
    get:
      tags: [Products]
      operationId: getProduct
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    put:
      tags: [Products]
      operationId: updateProduct
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    delete:
      tags: [Products]
      operationId: deleteProduct
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Deleted

  /products/export:
    get:
      tags: [Products]
      operationId: exportProducts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ========================= Catalog =========================
  /brands:
    get:
      tags: [Catalog]
      operationId: listBrands
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brand'
    post:
      tags: [Catalog]
      operationId: createBrand
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandWrite'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'

  /collections:
    get:
      tags: [Catalog]
      operationId: listCollections
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollections'
    post:
      tags: [Catalog]
      operationId: createCollection
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionWrite'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'

  /collections/{collectionId}:
    put:
      tags: [Catalog]
      operationId: updateCollection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: collectionId
