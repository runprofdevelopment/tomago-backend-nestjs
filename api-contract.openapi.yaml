components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Search:
      name: q
      in: query
      schema: { type: string }
    PeriodFilter:
      name: period
      in: query
      schema:
        type: string
        enum: [daily, weekly, monthly, yearly]
        default: monthly
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }

    LocalizedString:
      type: object
      properties:
        en: { type: string }
        ar: { type: string }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    # ----- Auth / Admin -----
    SignInRequest:
      type: object
      required: [email, password]
